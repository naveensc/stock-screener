# Screening thresholds — see PLAN.md for the reasoning behind each default.

# Applied to the whole universe before either screen below runs — keeps both screens focused
# on large/mega-cap names instead of drowning in Russell 2000 small-cap noise.
universe_filters:
  min_market_cap: 10000000000 # $10B. Tickers whose market cap can't be confirmed (no SEC
  # shares-outstanding data) are excluded rather than assumed to pass.

rsi:
  period: 14
  lookback_days: 252 # trading days (~1yr) used to build each ticker's own RSI distribution
  oversold_percentile: 10 # flag when today's RSI is at/below this percentile of its own history
  overbought_percentile: 90 # flag when today's RSI is at/above this percentile of its own history
  fallback_oversold: 30 # static RSI threshold used when a ticker lacks enough history for the percentile calc
  fallback_overbought: 70

ma_cross:
  fast: 50
  slow: 200

volume:
  spike_multiple: 1.5
  lookback_days: 20

bollinger:
  window: 20
  num_std: 2

# "Quality at a discount" hard filter — fundamentally-improving companies whose price is
# depressed by market/sector weakness rather than a company-specific problem.
quality_value:
  min_revenue_growth: 0.05 # YoY revenue growth must exceed this (5%)
  min_eps_growth: 0.0 # YoY EPS growth must be positive
  require_margin_improved: true # gross (or operating, if gross isn't tagged) margin must have improved YoY
  min_pct_below_52w_high: 0.15 # price must be at least this far below its 52-week high (15%) ...
  # ... unless it's below its long MA instead (uses ma_cross.slow above) — either counts as "priced low"
  trailing_return_window_days: 126 # ~6 months, used for the sector-attribution comparison
  max_sector_relative_underperformance: 0.05 # decline can't exceed the sector's median decline by more than this (5 percentage points)

# Combines both screens into a single ranked daily shortlist — regime-aware (down-weights
# signals fighting the broad market trend) and confluence-aware (rewards tickers both screens
# agree on). See PLAN.md-equivalent design discussion for rationale.
ranking:
  top_n: 6
  regime_ma_window: 200 # SPY vs. this MA determines uptrend/downtrend
  regime_misaligned_weight: 0.5 # weight applied to a signal that points against the current regime (full weight is 1.0)
  fundamental_weight: 5.0 # scales revenue_growth + eps_growth (typically 0.05-0.3) into technical-score-like units
  discount_weight: 2.0 # scales pct_below_high (typically 0.15-0.5) into technical-score-like units
  confluence_bonus: 2.0 # bonus for tickers matched by BOTH the technical and quality-value screens
