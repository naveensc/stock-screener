# Screening thresholds — see PLAN.md for the reasoning behind each default.

# Applied to the whole universe before either screen below runs — keeps both screens focused
# on large/mega-cap names instead of drowning in Russell 2000 small-cap noise.
universe_filters:
  min_market_cap: 10000000000 # $10B. Tickers whose market cap can't be confirmed (no SEC
  # shares-outstanding data) are excluded rather than assumed to pass.

rsi:
  period: 14
  lookback_days: 252 # trading days (~1yr) used to build each ticker's own RSI distribution
  oversold_percentile: 10 # flag when today's RSI is at/below this percentile of its own history
  overbought_percentile: 90 # flag when today's RSI is at/above this percentile of its own history
  fallback_oversold: 30 # static RSI threshold used when a ticker lacks enough history for the percentile calc
  fallback_overbought: 70

ma_cross:
  fast: 50
  slow: 200

volume:
  spike_multiple: 1.5
  lookback_days: 20

bollinger:
  window: 20
  num_std: 2

# The rsi / ma_cross / volume / bollinger blocks above drive the one-day alert tags shown next to
# each stock (golden cross, volume spike, ...). They annotate; they don't feed the scores below.

# Technical score: continuous factors (see src/technical.py), each ranked 0-100 across the
# universe, then weighted. Higher = more constructive.
technical_score:
  weights:
    trend: 0.35 # price vs 50/200-day averages + 50-day slope
    momentum: 0.30 # 12-1 month return
    relative_strength: 0.15 # 6-month return minus the sector median
    rsi: 0.10 # 100 - RSI percentile vs its own year (pullbacks score higher)
    volume: 0.10 # up-day / down-day volume (accumulation)
  momentum_lookback_days: 252
  momentum_skip_days: 21 # skip the latest month — short-term returns tend to reverse
  relative_strength_days: 126
  ma_slope_days: 20
  volume_window_days: 50
  smoothing_days: 5 # the score is the average of the last 5 daily scores, so one session can't swing it

# Composite = weighted percentile ranks. Quality and Valuation come from the life-cycle
# valuation analysis (src/valuation.py); Technical from the block above.
composite:
  quality: 0.40
  valuation: 0.30
  technical: 0.30

# What the email reports as having changed since the previous run.
changes:
  min_change: 5 # composite points; smaller day-to-day moves are noise
  top_n: 8 # movers shown per direction
  top_list_size: 20 # entering/leaving the top 20 by composite is a state change

email:
  top_ideas: 10
  regime_ma_window: 200 # SPY vs this average sets the market regime shown in the header

fundamentals_refresh:
  max_age_days: 7 # every ticker's statements are refreshed at least weekly ...
  buckets: 5 # ... about 1/5 of the universe per weekday, to stay under Yahoo's rate limits
